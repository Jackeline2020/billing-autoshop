basePath: /
definitions:
  domain.Budget:
    properties:
      correlation_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.BudgetItem'
        type: array
      order_id:
        type: string
      saga_id:
        type: string
      status:
        $ref: '#/definitions/domain.BudgetStatus'
      total:
        type: number
      total_parts:
        type: number
      total_services:
        type: number
      updated_at:
        type: string
    type: object
  domain.BudgetItem:
    properties:
      kind:
        $ref: '#/definitions/domain.ItemKind'
      name:
        type: string
      quantity:
        type: integer
      reference_id:
        type: string
      unit_price:
        type: number
    type: object
  domain.BudgetStatus:
    enum:
    - gerado
    - aprovado
    - cancelado
    type: string
    x-enum-varnames:
    - BudgetGenerated
    - BudgetApproved
    - BudgetCancelled
  domain.ItemKind:
    enum:
    - servico
    - peca
    type: string
    x-enum-varnames:
    - ItemService
    - ItemPart
  domain.Payment:
    properties:
      amount:
        type: number
      budget_id:
        type: string
      checkout_url:
        type: string
      correlation_id:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      order_id:
        type: string
      provider_payment_id:
        type: string
      provider_preference_id:
        type: string
      saga_id:
        type: string
      status:
        $ref: '#/definitions/domain.PaymentStatus'
      updated_at:
        type: string
    type: object
  domain.PaymentStatus:
    enum:
    - pendente
    - aprovado
    - recusado
    - expirado
    - estornado
    type: string
    x-enum-varnames:
    - PaymentPending
    - PaymentApproved
    - PaymentRejected
    - PaymentExpired
    - PaymentRefunded
  dto.ErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/errors.ValidationError'
        type: array
    type: object
  dto.PaymentNotification:
    properties:
      action:
        type: string
      data:
        properties:
          id:
            type: string
        type: object
      type:
        type: string
    type: object
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
info:
  contact: {}
  description: Orçamento e pagamento das ordens de serviço (Checkout Pro do Mercado
    Pago ou mock).
  title: AutoShop — Billing Service
  version: "1.0"
paths:
  /budgets/{order_id}:
    get:
      description: Mostra o orçamento da OS, com itens, totais e status
      parameters:
      - description: ID da OS
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Budget'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar orçamento
      tags:
      - budgets
  /health:
    get:
      description: Indica se o processo da API está de pé
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /payments/{order_id}:
    get:
      description: Mostra o pagamento da OS, incluindo o link de pagamento enviado
        ao cliente
      parameters:
      - description: ID da OS
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Payment'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar pagamento
      tags:
      - payments
  /payments/webhook:
    post:
      consumes:
      - application/json
      description: Recebe o aviso do Mercado Pago (ou do mock) de que um pagamento
        mudou. O status é confirmado consultando o provedor.
      parameters:
      - description: Aviso do provedor
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.PaymentNotification'
      - description: Tipo do aviso (payment)
        in: query
        name: type
        type: string
      - description: ID do pagamento no provedor
        in: query
        name: data.id
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Webhook do provedor de pagamento
      tags:
      - payments
securityDefinitions:
  BearerAuth:
    description: 'Digite: Bearer {seu_token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
