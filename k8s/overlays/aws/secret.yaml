# Os *_PLACEHOLDER são trocados pelo pipeline (job deploy-aws) pelos secrets
# do repositório antes do apply
apiVersion: v1
kind: Secret
metadata:
  name: autoshop-billing-secrets
  namespace: autoshop
type: Opaque
stringData:
  DB_PASSWORD: "DB_PASSWORD_PLACEHOLDER"
  JWT_SECRET: "JWT_SECRET_PLACEHOLDER"
  NEW_RELIC_LICENSE_KEY: "NEW_RELIC_LICENSE_KEY_PLACEHOLDER"
  # Credenciais de teste aceitas pelo payment-mock
  PAYMENT_CLIENT_ID: "autoshop-client"
  PAYMENT_CLIENT_SECRET: "autoshop-secret"
