apiVersion: v1
kind: ConfigMap
metadata:
  name: autoshop-billing-config
  namespace: autoshop
data:
  PORT: "8080"
  AWS_REGION: "us-east-1"
  # Banco próprio do Billing (stack billing/ do infra-db-autoshop); o host é
  # trocado pelo pipeline a partir do secret DB_HOST
  DB_HOST: "DB_HOST_PLACEHOLDER"
  DB_PORT: "5432"
  DB_NAME: "billing"
  DB_USER: "billing"
  DB_SSLMODE: "require"
  BILLING_COMMANDS_QUEUE: "billing-commands"
  OS_EVENTS_QUEUE: "os-events"
  # Provedor de pagamento no formato do Mercado Pago (mock rodando no cluster)
  PAYMENT_PROVIDER_URL: "http://autoshop-payment-mock:8080"
  PAYMENT_NOTIFICATION_URL: "http://autoshop-billing:8080/payments/webhook"
  PAYMENT_TIMEOUT: "15m"
  NEW_RELIC_APP_NAME: "autoshop-billing"
