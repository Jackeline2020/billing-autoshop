sonar.projectKey=Jackeline2020_billing-autoshop
sonar.projectName=AutoShop Billing Service
sonar.organization=jackeline2020

sonar.sources=.
# As migrations são SQL do PostgreSQL; as regras de SQL do SonarCloud são
# do Oracle (PL/SQL) e não se aplicam a elas (ex.: exigir VARCHAR2)
sonar.exclusions=**/*_test.go,docs/**,internal/mocks/**,localstack/**,localdev/**,migrations/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
sonar.sourceEncoding=UTF-8

# Código de inicialização (subida do servidor e do agente do New Relic),
# sem regra de negócio
sonar.coverage.exclusions=cmd/**,pkg/observability/**
