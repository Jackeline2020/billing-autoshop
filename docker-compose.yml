services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=billing
      - POSTGRES_PASSWORD=billing
      - POSTGRES_DB=billing
    ports:
      - "5433:5432"
    volumes:
      - ./localdev/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-path=/migrations", "-database=postgres://billing:billing@postgres:5432/billing?sslmode=disable", "up"]

  billing-service:
    build: .
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=billing
      - DB_PASSWORD=billing
      - DB_NAME=billing
      - DB_SSLMODE=disable
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=autoshop-billing
    depends_on:
      migrate:
        condition: service_completed_successfully
